<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered Autonomous ETL Platform</title>
  <!-- Load React, ReactDOM, and Babel for pure local modern browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('upload'); // upload, instruction, review, comparison, export, history
      const [workflowId, setWorkflowId] = useState(null);
      const [uploadMeta, setUploadMeta] = useState(null);
      const [datasetProfile, setDatasetProfile] = useState(null);
      const [origQuality, setOrigQuality] = useState(null);
      const [datasetPreview, setDatasetPreview] = useState([]);
      
      const [instruction, setInstruction] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [etlPlan, setEtlPlan] = useState(null);
      const [isLiveQwen, setIsLiveQwen] = useState(false);

      const [approvedSteps, setApprovedSteps] = useState({});
      const [isExecuting, setIsExecuting] = useState(false);
      const [executionLogs, setExecutionLogs] = useState([]);
      const [comparison, setComparison] = useState(null);
      const [transQuality, setTransQuality] = useState(null);
      const [transPreview, setTransPreview] = useState([]);

      const [history, setHistory] = useState([]);
      const [statusMessage, setStatusMessage] = useState('');

      useEffect(() => {
        loadHistory();
      }, []);

      const loadHistory = async () => {
        try {
          const res = await fetch('/api/workflows');
          if (res.ok) {
            const data = await res.json();
            setHistory(data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setStatusMessage('Uploading and profiling dataset...');
        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await fetch('/api/datasets/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Upload failed');

          setWorkflowId(data.workflow_id);
          setUploadMeta(data.metadata);
          setDatasetProfile(data.profile);
          setOrigQuality(data.quality);
          setDatasetPreview(data.preview);
          setStatusMessage(`Uploaded: ${data.metadata.file_name} (${data.metadata.rows} rows, ${data.metadata.columns} cols)`);
          setActiveTab('instruction');
          loadHistory();
        } catch (err) {
          alert('Error: ' + err.message);
          setStatusMessage('');
        }
      };

      const handleGeneratePlan = async () => {
        if (!instruction.trim()) {
          alert('Please enter natural-language instructions.');
          return;
        }
        setIsGenerating(true);
        setStatusMessage('Qwen analyzing schema and generating execution plan...');

        try {
          const res = await fetch('/api/etl/generate-plan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ workflow_id: workflowId, instruction })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Plan generation failed');

          setEtlPlan(data.plan);
          setIsLiveQwen(data.is_live_qwen);
          // Initialize approval states to true by default for user review
          const initialApprovals = {};
          data.plan.steps.forEach(s => { initialApprovals[s.step_id] = true; });
          setApprovedSteps(initialApprovals);

          setStatusMessage('Plan generated successfully.');
          setActiveTab('review');
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          setIsGenerating(false);
        }
      };

      const toggleApproval = (stepId) => {
        setApprovedSteps(prev => ({ ...prev, [stepId]: !prev[stepId] }));
      };

      const handleExecutePipeline = async () => {
        const approvedList = Object.keys(approvedSteps).filter(k => approvedSteps[k]);
        const rejectedList = Object.keys(approvedSteps).filter(k => !approvedSteps[k]);

        if (approvedList.length === 0) {
          alert('You must explicitly approve at least one step before execution.');
          return;
        }

        setIsExecuting(true);
        setStatusMessage('Saving approvals and executing approved transformations in sandbox...');

        try {
          // 1. Save approvals
          await fetch('/api/etl/approve-step', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              workflow_id: workflowId,
              approved_steps: approvedList,
              rejected_steps: rejectedList
            })
          });

          // 2. Execute
          const res = await fetch('/api/etl/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ workflow_id: workflowId })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Execution failed');

          setExecutionLogs(data.execution_logs);
          setComparison(data.comparison);
          setTransQuality(data.transformed_quality);
          setTransPreview(data.transformed_preview);

          setStatusMessage('Pipeline executed successfully.');
          setActiveTab('comparison');
          loadHistory();
        } catch (err) {
          alert('Execution Error: ' + err.message);
        } finally {
          setIsExecuting(false);
        }
      };

      return (
        <div className="flex h-screen overflow-hidden">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 text-white flex flex-col justify-between">
            <div>
              <div className="p-6 border-b border-slate-800">
                <div className="flex items-center space-x-2">
                  <span className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white text-lg">Q</span>
                  <span className="font-semibold text-lg tracking-tight">Qwen ETL Studio</span>
                </div>
                <p className="text-xs text-slate-400 mt-1">Autonomous Human-in-the-Loop</p>
              </div>

              <nav className="p-4 space-y-1">
                {[
                  { id: 'upload', label: '1. Universal Upload', icon: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12' },
                  { id: 'instruction', label: '2. Natural Language', icon: 'M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z' },
                  { id: 'review', label: '3. Human Approval', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' },
                  { id: 'comparison', label: '4. Quality & Compare', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' },
                  { id: 'export', label: '5. Cleaned Dataset', icon: 'M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
                  { id: 'history', label: '6. Workflow History', icon: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition ${
                      activeTab === tab.id
                        ? 'bg-indigo-600 text-white shadow-sm'
                        : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={tab.icon}></path>
                    </svg>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800 text-xs text-slate-400">
              <div>Session: <span className="font-mono text-indigo-400">{workflowId ? workflowId.slice(0, 8) : 'None'}</span></div>
              <div className="mt-1">Qwen Engine: <span className="text-emerald-400 font-semibold">{isLiveQwen ? 'Ollama Live' : 'Deterministic Mode'}</span></div>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col overflow-y-auto">
            {/* Top Bar */}
            <header className="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
              <div>
                <h1 className="text-xl font-bold text-slate-900 capitalize">{activeTab.replace('-', ' ')} Studio</h1>
                <p className="text-xs text-slate-500">{statusMessage || 'System ready.'}</p>
              </div>
              <div className="flex items-center space-x-4">
                {origQuality && (
                  <div className="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-md border border-slate-200 text-xs">
                    <span className="text-slate-600">Original Quality:</span>
                    <span className="font-bold text-indigo-600">{origQuality.overall_score}/100</span>
                  </div>
                )}
                {transQuality && (
                  <div className="flex items-center space-x-2 bg-emerald-50 px-3 py-1.5 rounded-md border border-emerald-200 text-xs">
                    <span className="text-emerald-800">Transformed Quality:</span>
                    <span className="font-bold text-emerald-600">{transQuality.overall_score}/100</span>
                  </div>
                )}
              </div>
            </header>

            {/* Tab 1: Universal Upload */}
            {activeTab === 'upload' && (
              <div className="p-8 max-w-5xl mx-auto w-full space-y-6">
                <div className="bg-white p-8 rounded-xl border-2 border-dashed border-indigo-200 text-center hover:border-indigo-500 transition">
                  <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                  </div>
                  <h3 className="text-base font-semibold text-slate-900">Upload Dataset in Any Format</h3>
                  <p className="text-xs text-slate-500 mt-1 max-w-md mx-auto">
                    Supported: CSV, TSV, XLSX, XLS, JSON, JSONL, XML, Parquet, SQLite (.db, .sqlite), SQL Dumps, TXT, PDF, DOCX
                  </p>
                  <label className="mt-4 inline-block px-5 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg cursor-pointer hover:bg-indigo-700 shadow-sm">
                    Select File to Ingest
                    <input type="file" className="hidden" onChange={handleFileUpload} />
                  </label>
                </div>

                {uploadMeta && (
                  <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                    <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                      <span className="font-semibold text-sm">Extracted Profile: {uploadMeta.file_name}</span>
                      <span className="text-xs text-slate-500">Method: {uploadMeta.extraction_method}</span>
                    </div>
                    <div className="p-6 grid grid-cols-4 gap-4 text-center">
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <div className="text-xs text-slate-500">Rows</div>
                        <div className="text-xl font-bold text-slate-900">{uploadMeta.rows}</div>
                      </div>
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <div className="text-xs text-slate-500">Columns</div>
                        <div className="text-xl font-bold text-slate-900">{uploadMeta.columns}</div>
                      </div>
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <div className="text-xs text-slate-500">Duplicates</div>
                        <div className="text-xl font-bold text-amber-600">{origQuality ? origQuality.uniqueness.duplicate_rows : 0}</div>
                      </div>
                      <div className="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <div className="text-xs text-slate-500">Missing Cells</div>
                        <div className="text-xl font-bold text-rose-600">{origQuality ? origQuality.completeness.total_missing : 0}</div>
                      </div>
                    </div>

                    {datasetPreview.length > 0 && (
                      <div className="p-6 border-t border-slate-200 overflow-x-auto">
                        <h4 className="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-3">Dataset Preview (First 15 Rows)</h4>
                        <table className="min-w-full text-xs text-left border border-slate-200">
                          <thead className="bg-slate-100 text-slate-700 uppercase">
                            <tr>
                              {Object.keys(datasetPreview[0]).map(col => (
                                <th key={col} className="px-3 py-2 border-b border-r border-slate-200">{col}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {datasetPreview.map((row, idx) => (
                              <tr key={idx} className="hover:bg-slate-50 border-b border-slate-100">
                                {Object.values(row).map((val, cidx) => (
                                  <td key={cidx} className="px-3 py-2 border-r border-slate-100 font-mono text-slate-600">{String(val)}</td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* Tab 2: Natural Language Instruction */}
            {activeTab === 'instruction' && (
              <div className="p-8 max-w-4xl mx-auto w-full space-y-6">
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h3 className="font-semibold text-base text-slate-900 mb-2">Natural Language ETL Instructions</h3>
                  <p className="text-xs text-slate-500 mb-4">
                    Describe your data transformations in plain English. Qwen will analyze the dataset schema, detect risks, and generate an executable Python/SQL transformation plan.
                  </p>
                  <textarea
                    rows="4"
                    value={instruction}
                    onChange={(e) => setInstruction(e.target.value)}
                    placeholder="e.g. Remove duplicate customer records, normalize column headers to snake_case, standardize email addresses, and fill missing age values using the median."
                    className="w-full p-4 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  ></textarea>

                  <div className="mt-4 flex justify-between items-center">
                    <span className="text-xs text-slate-400">Model: Qwen (Local Open-Source)</span>
                    <button
                      onClick={handleGeneratePlan}
                      disabled={isGenerating || !workflowId}
                      className="px-6 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition shadow-sm"
                    >
                      {isGenerating ? 'Qwen Analyzing...' : 'Generate ETL Plan'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Tab 3: Human Approval Center */}
            {activeTab === 'review' && etlPlan && (
              <div className="p-8 max-w-5xl mx-auto w-full space-y-6">
                <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-xl flex justify-between items-center">
                  <div>
                    <h3 className="font-semibold text-sm text-indigo-950">Human-in-the-Loop Review</h3>
                    <p className="text-xs text-indigo-700">Every transformation step must be explicitly approved before execution. Reject any steps that violate business constraints.</p>
                  </div>
                  <button
                    onClick={handleExecutePipeline}
                    disabled={isExecuting}
                    className="px-6 py-2.5 bg-emerald-600 text-white text-sm font-semibold rounded-lg hover:bg-emerald-700 disabled:opacity-50 shadow-sm"
                  >
                    {isExecuting ? 'Executing in Sandbox...' : 'Approve & Execute Selected'}
                  </button>
                </div>

                <div className="space-y-4">
                  {etlPlan.steps.map((step, idx) => (
                    <div key={step.step_id} className={`bg-white rounded-xl border p-5 transition ${approvedSteps[step.step_id] ? 'border-slate-300' : 'border-rose-200 bg-rose-50/20'}`}>
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="flex items-center space-x-2">
                            <span className="px-2 py-0.5 rounded text-xs font-bold uppercase bg-slate-100 text-slate-700">{step.step_id}</span>
                            <h4 className="font-semibold text-slate-900 text-sm">{step.name}</h4>
                            <span className={`px-2 py-0.5 rounded text-xs font-semibold ${step.risk_level === 'high' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                              {step.risk_level} risk
                            </span>
                          </div>
                          <p className="text-xs text-slate-600 mt-1">{step.description}</p>
                          <div className="mt-2 text-xs text-slate-500">
                            Target Columns: <span className="font-mono text-indigo-600">{step.target_columns.join(', ') || 'All'}</span>
                          </div>
                        </div>

                        <button
                          onClick={() => toggleApproval(step.step_id)}
                          className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${
                            approvedSteps[step.step_id]
                              ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                              : 'bg-rose-100 text-rose-800 border border-rose-300'
                          }`}
                        >
                          {approvedSteps[step.step_id] ? 'Approved' : 'Rejected'}
                        </button>
                      </div>

                      <div className="mt-4 bg-slate-900 rounded-lg p-3 text-xs text-slate-200 font-mono overflow-x-auto">
                        <div className="text-slate-400 text-[10px] uppercase mb-1">Generated Python / SQL:</div>
                        <code>{step.code_representation}</code>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Tab 4: Comparison & Data Quality Dashboard */}
            {activeTab === 'comparison' && comparison && (
              <div className="p-8 max-w-5xl mx-auto w-full space-y-6">
                <div className="grid grid-cols-3 gap-6">
                  <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center">
                    <span className="text-xs text-slate-500 uppercase font-semibold">Original Quality</span>
                    <div className="text-3xl font-extrabold text-slate-800 mt-2">{comparison.quality_comparison.original_score}/100</div>
                  </div>
                  <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center">
                    <span className="text-xs text-slate-500 uppercase font-semibold">Transformed Quality</span>
                    <div className="text-3xl font-extrabold text-emerald-600 mt-2">{comparison.quality_comparison.transformed_score}/100</div>
                  </div>
                  <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center">
                    <span className="text-xs text-slate-500 uppercase font-semibold">Quality Delta</span>
                    <div className={`text-3xl font-extrabold mt-2 ${comparison.quality_comparison.improvement >= 0 ? 'text-indigo-600' : 'text-rose-600'}`}>
                      {comparison.quality_comparison.improvement > 0 ? `+${comparison.quality_comparison.improvement}` : comparison.quality_comparison.improvement}
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
                  <h4 className="font-semibold text-sm text-slate-900 mb-4">Quantitative Quality Metrics Breakdown</h4>
                  <div className="space-y-3">
                    {[
                      { name: 'Completeness (Missing Values)', delta: comparison.quality_comparison.completeness_delta, desc: `${comparison.missing_analysis.missing_values_resolved} missing cells resolved` },
                      { name: 'Uniqueness (Duplicate Records)', delta: comparison.quality_comparison.uniqueness_delta, desc: `${comparison.duplicate_analysis.duplicates_removed} duplicates removed` },
                      { name: 'Validity (Constraint Conformance)', delta: comparison.quality_comparison.validity_delta, desc: 'Syntax and boundary rules verified' },
                      { name: 'Consistency (Format Uniformity)', delta: comparison.quality_comparison.consistency_delta, desc: 'Data type and whitespace sanitized' },
                      { name: 'Integrity (Identifier Preservation)', delta: comparison.quality_comparison.integrity_delta, desc: 'Key identifier preservation verified' }
                    ].map(metric => (
                      <div key={metric.name} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100 text-xs">
                        <div>
                          <div className="font-medium text-slate-800">{metric.name}</div>
                          <div className="text-slate-500 text-[11px]">{metric.desc}</div>
                        </div>
                        <span className={`font-bold ${metric.delta >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {metric.delta > 0 ? `+${metric.delta}` : metric.delta}%
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {comparison.warnings.length > 0 && (
                  <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl text-xs text-amber-800">
                    <div className="font-bold mb-1">Integrity Warnings:</div>
                    <ul className="list-disc pl-4 space-y-1">
                      {comparison.warnings.map((w, i) => <li key={i}>{w}</li>)}
                    </ul>
                  </div>
                )}
              </div>
            )}

            {/* Tab 5: Cleaned Dataset & Export */}
            {activeTab === 'export' && (
              <div className="p-8 max-w-5xl mx-auto w-full space-y-6">
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                  <div>
                    <h3 className="font-semibold text-sm text-slate-900">Export Final Transformed Dataset</h3>
                    <p className="text-xs text-slate-500">Download immutable outputs in your preferred format.</p>
                  </div>
                  <div className="flex space-x-3">
                    {['csv', 'json', 'parquet'].map(fmt => (
                      <a
                        key={fmt}
                        href={`/api/export/${workflowId}?format=${fmt}`}
                        download
                        className="px-4 py-2 bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs font-bold rounded-lg hover:bg-indigo-100 uppercase"
                      >
                        Download {fmt}
                      </a>
                    ))}
                  </div>
                </div>

                {transPreview.length > 0 && (
                  <div className="bg-white rounded-xl border border-slate-200 p-6 overflow-x-auto shadow-sm">
                    <h4 className="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-3">Cleaned Dataset Preview</h4>
                    <table className="min-w-full text-xs text-left border border-slate-200">
                      <thead className="bg-slate-100 text-slate-700 uppercase">
                        <tr>
                          {Object.keys(transPreview[0]).map(col => (
                            <th key={col} className="px-3 py-2 border-b border-r border-slate-200">{col}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {transPreview.map((row, idx) => (
                          <tr key={idx} className="hover:bg-slate-50 border-b border-slate-100">
                            {Object.values(row).map((val, cidx) => (
                              <td key={cidx} className="px-3 py-2 border-r border-slate-100 font-mono text-slate-600">{String(val)}</td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* Tab 6: Workflow History */}
            {activeTab === 'history' && (
              <div className="p-8 max-w-5xl mx-auto w-full space-y-6">
                <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
                  <h3 className="font-semibold text-sm text-slate-900 mb-4">Historical ETL Workflows</h3>
                  <table className="min-w-full text-xs text-left">
                    <thead className="bg-slate-50 text-slate-600 uppercase border-b border-slate-200">
                      <tr>
                        <th className="px-4 py-2">Workflow ID</th>
                        <th className="px-4 py-2">Created At</th>
                        <th className="px-4 py-2">Dataset</th>
                        <th className="px-4 py-2">Status</th>
                        <th className="px-4 py-2">Instructions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {history.map(item => (
                        <tr key={item.workflow_id} className="hover:bg-slate-50">
                          <td className="px-4 py-3 font-mono text-indigo-600">{item.workflow_id.slice(0, 8)}</td>
                          <td className="px-4 py-3 text-slate-500">{item.created_at}</td>
                          <td className="px-4 py-3 font-medium text-slate-800">{item.dataset_name}</td>
                          <td className="px-4 py-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                              item.status === 'completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-700'
                            }`}>{item.status}</span>
                          </td>
                          <td className="px-4 py-3 text-slate-500 truncate max-w-xs">{item.instruction || '-'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
